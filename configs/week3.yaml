seed: 1
expected_model_columns: 68
trials_per_model: 30
experiment: ingen_qr_week3
output_directory: data/week3
models:
  ridge:
    fixed: {}
    search:
      alpha: {type: float, low: 0.001, high: 100.0, log: true}
  elastic_net:
    fixed: {max_iter: 3000}
    search:
      alpha: {type: float, low: 0.00001, high: 0.05, log: true}
      l1_ratio: {type: float, low: 0.05, high: 0.95}
  random_forest:
    fixed: {n_jobs: 10}
    search:
      n_estimators: {type: categorical, choices: [50, 100, 200]}
      max_depth: {type: int, low: 3, high: 10}
      min_samples_leaf: {type: int, low: 5, high: 50}
      max_features: {type: float, low: 0.3, high: 1.0}
  lightgbm:
    fixed: {verbosity: -1, n_jobs: 2}
    search:
      n_estimators: {type: categorical, choices: [50, 100, 200]}
      num_leaves: {type: int, low: 8, high: 40}
      learning_rate: {type: float, low: 0.01, high: 0.2, log: true}
      min_child_samples: {type: int, low: 10, high: 80}
  adaboost:
    fixed: {}
    search:
      n_estimators: {type: categorical, choices: [30, 60, 100]}
      learning_rate: {type: float, low: 0.01, high: 1.0, log: true}
  mlp:
    fixed: {max_iter: 300, early_stopping: false}
    search:
      hidden_width: {type: categorical, choices: [16, 32, 64]}
      alpha: {type: float, low: 0.00001, high: 0.05, log: true}
      learning_rate_init: {type: float, low: 0.0001, high: 0.01, log: true}
